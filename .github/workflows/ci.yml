name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + --tests selector to run instead of the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - name: Provision JDK 8 for the Gradle toolchain
        id: jdk8
        uses: actions/setup-java@v2
        with:
          java-version: 8
          java-package: 'jdk'
          distribution: 'temurin'
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Use provisioned JDK 8 toolchain and enable test result logging
        run: |
          mkdir -p ~/.gradle/init.d
          printf 'org.gradle.java.installations.paths=${{ steps.jdk8.outputs.path }}\norg.gradle.java.installations.auto-download=false\n' >> ~/.gradle/gradle.properties
          cat > ~/.gradle/init.d/test-logging.gradle <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "passed", "skipped", "failed"
                      exceptionFormat "full"
                  }
                  afterSuite { desc, result ->
                      if (!desc.parent) {
                          println "Test results (${path}): ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                      }
                  }
              }
          }
          EOF
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble {0}', inputs.test-filter) || 'build -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest' }}
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - name: Build release jar
        if: matrix.java == '8'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jar --console=plain
      - name: List built jars
        if: matrix.java == '8'
        run: ls -la build/libs
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/junrar*.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
